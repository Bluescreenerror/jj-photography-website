<main id="main">
<section class="book wrap">
<div class="b-txt"><h1>Book a shoot<span class="sr"> with a Brampton &amp; Toronto photographer</span></h1>
<p class="lead">Tell me what you have in mind. This form sends your inquiry straight to jj_photography, and I'll reply by email.</p>
<p class="hand tilt">no pressure, just say hello</p></div>
<form id="bookForm" data-access-key="a100cacb-3941-4b27-865b-56d3c2798b12" novalidate>
<div class="row2"><label>Name <em>required</em><input name="name" autocomplete="name" autocapitalize="words" enterkeyhint="next" required></label>
<label>Email <em>required</em><input name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="next" required></label></div>
<div class="row2"><label>Phone <em>optional</em><input name="phone" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="next"></label>
<label>Type of shoot <em>required</em><select name="type" required><option value="">Choose one</option><option>Portraits</option><option>Event</option><option>Automotive</option><option>Creative</option><option>Wildlife</option><option>Not sure yet</option></select></label></div>
<div class="row2"><label>Preferred date <em>optional</em><input name="date" type="date"></label>
<label>Location <em>required</em><input name="location" placeholder="City or venue" autocomplete="address-level2" autocapitalize="words" enterkeyhint="next" required></label></div>
<div class="row2"><label>Number of people <em>optional</em><input name="people" type="number" min="1" inputmode="numeric" enterkeyhint="next"></label>
<label>Budget <em>optional</em><input name="budget" placeholder="Your range, if you have one" enterkeyhint="next"></label></div>
<label>Tell me about it <em>required</em><textarea name="message" rows="5" required placeholder="The occasion, the vibe, anything I should know"></textarea></label>
<label>How did you find me? <em>optional</em><input name="source" enterkeyhint="send"></label>
<input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
<button class="btn solid" type="submit">Send inquiry</button>
<p id="fs" role="status" aria-live="polite"></p>
</form></section>
</main>
